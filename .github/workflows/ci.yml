name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate Compose model
        run: docker compose --env-file tools/toolchain-versions.env config --quiet

  workspace:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build pinned toolchain
        run: docker compose --env-file tools/toolchain-versions.env build toolchain
      - name: Bootstrap frozen dependencies
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain ./scripts/bootstrap
      - name: Check deterministic generation
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm generate:check
      - name: Check formatting
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm format:check
      - name: Lint workspace
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm lint
      - name: Typecheck workspace
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm typecheck
      - name: Build workspace
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm build
      - name: Run tests
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm test
      - name: Run end-to-end tests
        run: docker compose --env-file tools/toolchain-versions.env run --rm toolchain pnpm test:e2e
