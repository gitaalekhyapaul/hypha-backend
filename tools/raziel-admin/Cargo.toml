[package]
name = "raziel-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "raziel-admin"

[dependencies]
prost.workspace = true
prost-types.workspace = true
raziel-authority.workspace = true
raziel-canonical.workspace = true
raziel-policy-ir = { workspace = true, features = ["strict-protobuf"] }
raziel-proto.workspace = true
raziel-verifier = { path = "../../crates/verifier" }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
raziel-snapshot.workspace = true

[[bin]]
name = "raziel-registry-writer"
path = "src/bin/raziel-registry-writer.rs"
