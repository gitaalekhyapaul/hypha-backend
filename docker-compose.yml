name: raziel

x-toolchain-service: &toolchain-service
  image: raziel-toolchain:m0
  build:
    context: .
    dockerfile: tools/docker/toolchain.Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE}
      GO_IMAGE: ${GO_IMAGE}
      BUF_IMAGE: ${BUF_IMAGE}
      RUST_IMAGE: ${RUST_IMAGE}
      PNPM_VERSION: ${PNPM_VERSION}
      PROTOC_VERSION: ${PROTOC_VERSION}
      PROTOBUF_COMPILER_PACKAGE_VERSION: ${PROTOBUF_COMPILER_PACKAGE_VERSION}
      LIBPROTOBUF_DEV_PACKAGE_VERSION: ${LIBPROTOBUF_DEV_PACKAGE_VERSION}
      LIBCLANG_14_DEV_PACKAGE_VERSION: ${LIBCLANG_14_DEV_PACKAGE_VERSION}
      RUST_VERSION: ${RUST_VERSION}
      SP1_VERSION: ${SP1_VERSION}
      SP1_CARGO_PROVE_AMD64_SHA256: ${SP1_CARGO_PROVE_AMD64_SHA256}
      SP1_CARGO_PROVE_ARM64_SHA256: ${SP1_CARGO_PROVE_ARM64_SHA256}
      SP1_RUST_TOOLCHAIN_TAG: ${SP1_RUST_TOOLCHAIN_TAG}
      SP1_RUST_TOOLCHAIN_AMD64_SIZE: ${SP1_RUST_TOOLCHAIN_AMD64_SIZE}
      SP1_RUST_TOOLCHAIN_AMD64_SHA256: ${SP1_RUST_TOOLCHAIN_AMD64_SHA256}
      SP1_RUST_TOOLCHAIN_ARM64_SIZE: ${SP1_RUST_TOOLCHAIN_ARM64_SIZE}
      SP1_RUST_TOOLCHAIN_ARM64_SHA256: ${SP1_RUST_TOOLCHAIN_ARM64_SHA256}
  working_dir: /workspace
  environment:
    RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
  volumes:
    - .:/workspace
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
    - pnpm-store:/pnpm/store
  init: true

x-secure-rust-service: &secure-rust-service
  <<: *toolchain-service
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    CARGO_HOME: /usr/local/cargo
    CARGO_NET_OFFLINE: "true"
    CARGO_TARGET_DIR: /tmp/raziel-target
    HOME: /tmp/raziel-home
    RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
    RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
    RUSTUP_TOOLCHAIN: "1.97.1"
  read_only: true
  tmpfs:
    - /tmp:rw,exec,mode=1777

services:
  toolchain:
    <<: *toolchain-service
    command: ["sleep", "infinity"]
    profiles: ["tools"]

  sp1-plonk-benchmark:
    <<: *toolchain-service
    command: ["./scripts/run-sp1-plonk-benchmark"]
    cpuset: "0-7"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    environment:
      CARGO_NET_OFFLINE: "true"
      GODEBUG: "gctrace=1"
      GOMAXPROCS: "${RAZIEL_SP1_WORKER_THREADS:-8}"
      GOMEMLIMIT: "${RAZIEL_SP1_GO_MEMORY_LIMIT:-24GiB}"
      HOME: /tmp/raziel-home
      RAYON_NUM_THREADS: "${RAZIEL_SP1_WORKER_THREADS:-8}"
      RAZIEL_SP1_BENCHMARK_PROFILE: "${RAZIEL_SP1_BENCHMARK_PROFILE:-local-30g}"
      RAZIEL_SP1_EXPECTED_GO_MEMORY_LIMIT: "${RAZIEL_SP1_GO_MEMORY_LIMIT:-24GiB}"
      RAZIEL_SP1_EXPECTED_GO_DEBUG: "gctrace=1"
      RAZIEL_SP1_EXPECTED_MEMORY_MAX_BYTES: "${RAZIEL_SP1_EXPECTED_MEMORY_MAX_BYTES:-32212254720}"
      RAZIEL_SP1_EXPECTED_VISIBLE_CPUS: "8"
      RAZIEL_SP1_EXPECTED_WORKER_THREADS: "${RAZIEL_SP1_WORKER_THREADS:-8}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
      SP1_PLONK_CIRCUIT_PATH: /opt/sp1/circuits/plonk
    mem_limit: "${RAZIEL_SP1_MEMORY_LIMIT:-30g}"
    memswap_limit: "${RAZIEL_SP1_MEMORY_LIMIT:-30g}"
    network_mode: none
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: ${RAZIEL_SP1_WORKSPACE_SOURCE:-.}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.sp1/circuits/plonk/v6.1.0
        target: /opt/sp1/circuits/plonk/v6.1.0
        read_only: true
        bind:
          create_host_path: false
    profiles: ["benchmark"]

  spicedb:
    image: ${SPICEDB_IMAGE}
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_PRESHARED_KEY:-raziel-local-development-only}
      - --http-enabled=true
      - --skip-release-check
      - --telemetry-endpoint=
    ports:
      - "50051:50051"
      - "8443:8443"

  spicedb-equivalence:
    image: ${SPICEDB_IMAGE}
    command:
      - serve
      - --grpc-preshared-key=raziel-equivalence-only
      - --skip-release-check
      - --telemetry-endpoint=
    profiles: ["equivalence"]

  redis:
    image: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        install -d -o redis -g redis -m 0700 /run/redis
        default_password=$$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')
        test "$${#default_password}" -eq 48
        # Redis replays AOF transactions as the default user. Its password stays
        # boot-local, so network clients still authenticate as the named service user.
        printf 'user default on >%s ~* &* +@all\nuser %s on >%s ~* &* +@all\n' \
          "$$default_password" \
          "$$RAZIEL_REDIS_USERNAME" "$$RAZIEL_REDIS_PASSWORD" \
          > /run/redis/users.acl
        unset default_password
        chown redis:redis /run/redis/users.acl
        chown -R redis:redis /data
        exec /usr/bin/setpriv \
          --reuid redis --regid redis --clear-groups --nnp \
          --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
          redis-server \
          --aclfile /run/redis/users.acl \
          --appendonly yes \
          --appendfsync always \
          --dir /data \
          --maxmemory 128mb \
          --maxmemory-policy noeviction
    environment:
      RAZIEL_REDIS_PASSWORD: ${RAZIEL_REDIS_PASSWORD:-raziel-local-development-only}
      RAZIEL_REDIS_USERNAME: ${RAZIEL_REDIS_USERNAME:-raziel}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning
          --user "$$RAZIEL_REDIS_USERNAME"
          --pass "$$RAZIEL_REDIS_PASSWORD"
          ping | grep -qx PONG
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - owner-internal
    tmpfs:
      - /run/redis:rw,nosuid,nodev,mode=0700
    volumes:
      - redis-data:/data
    profiles: ["services", "queue-conformance", "proof", "m5-live", "apps"]

  razield-private-init:
    <<: *toolchain-service
    user: "0:0"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        install -d \
          -o "$$RAZIEL_PRIVATE_UID" \
          -g "$$RAZIEL_PRIVATE_GID" \
          -m 0700 \
          /var/lib/raziel/private-envelopes \
          /var/lib/raziel/private-snapshots \
          /run/raziel-registry
        for private_root in \
          /var/lib/raziel/private-envelopes \
          /var/lib/raziel/private-snapshots \
          /run/raziel-registry
        do
          test "$$(stat --format=%a "$$private_root")" = 700
          test "$$(stat --format=%u "$$private_root")" = "$$RAZIEL_PRIVATE_UID"
          test "$$(stat --format=%g "$$private_root")" = "$$RAZIEL_PRIVATE_GID"
        done
    environment:
      RAZIEL_PRIVATE_GID: "${HOST_GID:-1000}"
      RAZIEL_PRIVATE_UID: "${HOST_UID:-1000}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - razield-private-envelopes:/var/lib/raziel/private-envelopes
      - razield-private-snapshots:/var/lib/raziel/private-snapshots
      - raziel-registry-ipc:/run/raziel-registry
    profiles: ["services", "proof"]

  razield-proof-dependency-fetch:
    <<: *toolchain-service
    user: "0:0"
    working_dir: /tmp
    command: ["/usr/local/bin/prepare-proof-sandbox-dependencies"]
    environment:
      CARGO_HOME: /usr/local/cargo
      GOCACHE: /tmp/raziel-go-build
      GOMODCACHE: /var/cache/raziel-proof-go-mod
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOTOOLCHAIN: local
      HOME: /tmp/raziel-home
      RAZIEL_SP1_CRATE_VERSION: "${SP1_VERSION}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777,size=268435456
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./scripts/prepare-proof-sandbox-dependencies
        target: /usr/local/bin/prepare-proof-sandbox-dependencies
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: cargo-registry
        target: /usr/local/cargo/registry
        read_only: true
      - type: volume
        source: razield-proof-go-mod-cache
        target: /var/cache/raziel-proof-go-mod
    profiles: ["proof", "m5-live"]

  razield-proof-build:
    <<: *toolchain-service
    user: "0:0"
    command: ["./scripts/prepare-proof-sandbox-runtime"]
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /var/cache/raziel-proof-build
      GOCACHE: /var/cache/raziel-proof-build/go-build
      GOFLAGS: -mod=readonly -modfile=/var/cache/raziel-proof-go-mod/raziel-sp1-gnark.mod
      GOMODCACHE: /var/cache/raziel-proof-go-mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      HOME: /tmp/raziel-home
      RAZIEL_PROOF_RUNTIME_ROOT: /opt/raziel-runtime
      RUSTUP_TOOLCHAIN: "1.97.1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777,size=1073741824
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry:ro
      - cargo-git:/usr/local/cargo/git:ro
      - razield-proof-build-cache:/var/cache/raziel-proof-build
      - type: volume
        source: razield-proof-go-mod-cache
        target: /var/cache/raziel-proof-go-mod
        read_only: true
      - razield-proof-runtime:/opt/raziel-runtime
    depends_on:
      razield-proof-dependency-fetch:
        condition: service_completed_successfully
    profiles: ["proof", "m5-live"]

  razield-proof-init: &razield-proof-init-service
    <<: *toolchain-service
    user: "0:0"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        memory_bytes=$$(awk '/^MemTotal:/ { printf "%.0f", $$2 * 1024 }' /proc/meminfo)
        test "$$memory_bytes" -ge 66571993088
        install -d \
          -o "$$RAZIEL_PRIVATE_UID" \
          -g "$$RAZIEL_PRIVATE_GID" \
          -m 0700 \
          /run/raziel-proof
        test "$$(stat --format=%a /run/raziel-proof)" = 700
        test "$$(stat --format=%u /run/raziel-proof)" = "$$RAZIEL_PRIVATE_UID"
        test "$$(stat --format=%g /run/raziel-proof)" = "$$RAZIEL_PRIVATE_GID"
    environment:
      RAZIEL_PRIVATE_GID: "${HOST_GID:-1000}"
      RAZIEL_PRIVATE_UID: "${HOST_UID:-1000}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - razield-proof-ipc:/run/raziel-proof
    profiles: ["proof"]

  razield-proof-sandbox: &razield-proof-sandbox-service
    <<: *toolchain-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["/opt/raziel-runtime/razield-proof-launcher"]
    environment:
      GOMAXPROCS: "8"
      GOMEMLIMIT: "24GiB"
      HOME: /tmp
      RAYON_NUM_THREADS: "8"
      RAZIEL_EXPECTED_VERIFICATION_KEY_ID: ${RAZIEL_EXPECTED_VERIFICATION_KEY_ID:-}
      RAZIEL_GUEST_ELF_PATH: /opt/raziel-runtime/raziel-authorization-guest
      RAZIEL_PRIVATE_SNAPSHOT_ROOT: /var/lib/raziel/private-snapshots
      RAZIEL_PROOF_LAUNCHER_SOCKET_PATH: /run/raziel-proof/launcher.sock
      RAZIEL_PROVER_CHILD_PATH: /opt/raziel-runtime/razield-prover
      RAZIEL_PROVER_CHILD_SOCKET_PATH: /run/raziel-proof/child.sock
      RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
      RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
      SP1_PLONK_CIRCUIT_PATH: /opt/sp1/circuits/plonk
    cpuset: "0-7"
    mem_limit: "60129542144"
    memswap_limit: "60129542144"
    network_mode: none
    read_only: true
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=0700,size=1073741824,uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}
    volumes:
      - type: volume
        source: razield-proof-runtime
        target: /opt/raziel-runtime
        read_only: true
      - type: volume
        source: razield-private-snapshots
        target: /var/lib/raziel/private-snapshots
        read_only: true
      - type: volume
        source: razield-proof-ipc
        target: /run/raziel-proof
      - type: bind
        source: ${RAZIEL_REGISTRY_PATH:-./.raziel/state/registry}
        target: /var/lib/raziel/registry
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RAZIEL_SP1_PLONK_SETUP_PATH:-./.sp1/circuits/plonk/v6.1.0}
        target: /opt/sp1/circuits/plonk/v6.1.0
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      razield-proof-build:
        condition: service_completed_successfully
      razield-proof-init:
        condition: service_completed_successfully
      razield-private-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/raziel-proof/launcher.sock &&
          test "$$(stat --format=%a /run/raziel-proof/launcher.sock)" = 600 &&
          test "$$(stat --format=%u /run/raziel-proof/launcher.sock)" = "${HOST_UID:-1000}"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: unless-stopped
    profiles: ["proof"]

  razield-proof-worker: &razield-proof-worker-service
    <<: *secure-rust-service
    command: ["cargo", "run", "--locked", "--offline", "-p", "razield", "--bin", "razield-proof-worker"]
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /tmp/raziel-target
      HOME: /tmp/raziel-home
      RAZIEL_EXPECTED_SP1_VKEY_HASH: ${RAZIEL_EXPECTED_SP1_VKEY_HASH:-}
      RAZIEL_EXPECTED_VERIFICATION_KEY_ID: ${RAZIEL_EXPECTED_VERIFICATION_KEY_ID:-}
      RAZIEL_PRIVATE_ENVELOPE_ROOT: /var/lib/raziel/private-envelopes
      RAZIEL_PROOF_LAUNCHER_SOCKET_PATH: /run/raziel-proof/launcher.sock
      RAZIEL_QUEUE_PREFIX: ${RAZIEL_QUEUE_PREFIX:-raziel-capabilities}
      RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
      RAZIEL_REDIS_URL: redis://${RAZIEL_REDIS_USERNAME:-raziel}:${RAZIEL_REDIS_PASSWORD:-raziel-local-development-only}@redis:6379/0
      RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
      RUSTUP_TOOLCHAIN: "1.97.1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry:ro
      - cargo-git:/usr/local/cargo/git:ro
      - razield-private-envelopes:/var/lib/raziel/private-envelopes
      - razield-proof-ipc:/run/raziel-proof
      - type: bind
        source: ${RAZIEL_REGISTRY_PATH:-./.raziel/state/registry}
        target: /var/lib/raziel/registry
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
      razield-private-init:
        condition: service_completed_successfully
      razield-proof-sandbox:
        condition: service_healthy
    networks:
      - owner-internal
    profiles: ["proof"]

  razield:
    <<: *secure-rust-service
    command: ["cargo", "run", "--locked", "--offline", "-p", "razield", "--bin", "razield"]
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /tmp/raziel-target
      HOME: /tmp/raziel-home
      RAZIEL_BIND_ADDRESS: 0.0.0.0:50052
      RAZIEL_PRIVATE_ENVELOPE_ROOT: /var/lib/raziel/private-envelopes
      RAZIEL_PRIVATE_SNAPSHOT_ROOT: /var/lib/raziel/private-snapshots
      RAZIEL_QUEUE_PREFIX: ${RAZIEL_QUEUE_PREFIX:-raziel-capabilities}
      RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
      RAZIEL_REGISTRY_WRITER_SOCKET_PATH: /run/raziel-registry/writer.sock
      RAZIEL_REDIS_URL: redis://${RAZIEL_REDIS_USERNAME:-raziel}:${RAZIEL_REDIS_PASSWORD:-raziel-local-development-only}@redis:6379/0
      RAZIEL_SNAPSHOT_KEY_PATH: /run/secrets/raziel/snapshot-authority.pk8
      RAZIEL_SPICEDB_AUTH_TOKEN_PATH: /run/secrets/raziel/spicedb-token
      RAZIEL_SPICEDB_ENDPOINT: http://spicedb:50051
      RAZIEL_SPICEDB_ENDPOINT_REF: ${RAZIEL_SPICEDB_ENDPOINT_REF:-owner-spicedb}
      RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
      RAZIEL_ZED_TOKEN_PATH: /run/secrets/raziel/zed-token
      RAZIEL_ZED_TOKEN_SECRET_REF: ${RAZIEL_ZED_TOKEN_SECRET_REF:-reconciliation-revision}
      RUSTUP_TOOLCHAIN: "1.97.1"
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry:ro
      - cargo-git:/usr/local/cargo/git:ro
      - razield-private-envelopes:/var/lib/raziel/private-envelopes
      - razield-private-snapshots:/var/lib/raziel/private-snapshots
      - raziel-registry-ipc:/run/raziel-registry
      - ${RAZIEL_REGISTRY_PATH:-./.raziel/state/registry}:/var/lib/raziel/registry:ro
      - ${RAZIEL_SNAPSHOT_KEY_PATH:-/dev/null}:/run/secrets/raziel/snapshot-authority.pk8:ro
      - ${RAZIEL_SPICEDB_AUTH_TOKEN_PATH:-/dev/null}:/run/secrets/raziel/spicedb-token:ro
      - ${RAZIEL_ZED_TOKEN_PATH:-/dev/null}:/run/secrets/raziel/zed-token:ro
    depends_on:
      redis:
        condition: service_healthy
      razield-private-init:
        condition: service_completed_successfully
      raziel-registry-writer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - /bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/50052'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks:
      - default
      - owner-internal
    profiles: ["services"]

  raziel-registry-writer:
    <<: *secure-rust-service
    command:
      - cargo
      - run
      - --locked
      - --offline
      - -p
      - raziel-admin
      - --bin
      - raziel-registry-writer
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /tmp/raziel-target
      HOME: /tmp/raziel-home
      RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
      RAZIEL_REGISTRY_WRITER_SOCKET_PATH: /run/raziel-registry/writer.sock
      RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
      RUSTUP_TOOLCHAIN: "1.97.1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry:ro
      - cargo-git:/usr/local/cargo/git:ro
      - raziel-registry-ipc:/run/raziel-registry
      - ${RAZIEL_REGISTRY_PATH:-./.raziel/state/registry}:/var/lib/raziel/registry
    depends_on:
      razield-private-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/raziel-registry/writer.sock &&
          test "$$(stat --format=%a /run/raziel-registry/writer.sock)" = 600 &&
          test "$$(stat --format=%u /run/raziel-registry/writer.sock)" = "${HOST_UID:-1000}"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    profiles: ["services"]

  bullmq-conformance:
    <<: *secure-rust-service
    cap_drop:
      - ALL
    command:
      - cargo
      - test
      - --locked
      - --offline
      - -p
      - razield
      - --test
      - bullmq_conformance
      - --
      - --ignored
    user: "0:0"
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /var/cache/raziel-target
      HOME: /tmp/raziel-home
      RAZIEL_QUEUE_TEST_PREFIX: raziel-conformance
      RAZIEL_QUEUE_TEST_REDIS_URL: redis://${RAZIEL_REDIS_USERNAME:-raziel}:${RAZIEL_REDIS_PASSWORD:-raziel-local-development-only}@redis:6379/0
      RUSTUP_TOOLCHAIN: "1.97.1"
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git:ro
      - queue-conformance-target:/var/cache/raziel-target
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - owner-internal
    security_opt:
      - no-new-privileges:true
    profiles: ["queue-conformance"]

  verifierd-worker-build:
    <<: *toolchain-service
    user: "0:0"
    command: ["./scripts/prepare-verifier-sandbox-runtime"]
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /var/cache/raziel-verifier-build
      HOME: /tmp/raziel-home
      RAZIEL_VERIFIER_RUNTIME_ROOT: /opt/raziel-verifier-runtime
      RUSTUP_TOOLCHAIN: "1.97.1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777,size=268435456
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry:ro
      - cargo-git:/usr/local/cargo/git:ro
      - verifierd-worker-build-cache:/var/cache/raziel-verifier-build
      - verifierd-worker-runtime:/opt/raziel-verifier-runtime
    profiles: ["services", "m5-live"]

  verifierd-worker-init:
    <<: *toolchain-service
    user: "0:0"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        install -d \
          -o "$$RAZIEL_PRIVATE_UID" \
          -g "$$RAZIEL_PRIVATE_GID" \
          -m 0700 \
          /run/raziel-verifier
        test "$$(stat --format=%a /run/raziel-verifier)" = 700
        test "$$(stat --format=%u /run/raziel-verifier)" = "$$RAZIEL_PRIVATE_UID"
        test "$$(stat --format=%g /run/raziel-verifier)" = "$$RAZIEL_PRIVATE_GID"
    environment:
      RAZIEL_PRIVATE_GID: "${HOST_GID:-1000}"
      RAZIEL_PRIVATE_UID: "${HOST_UID:-1000}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - verifierd-worker-ipc:/run/raziel-verifier
    profiles: ["services"]

  verifierd-worker-sandbox:
    <<: *toolchain-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["/opt/raziel-verifier-runtime/verifierd-worker"]
    environment:
      HOME: /tmp
      RAZIEL_VERIFIER_CHILD_PATH: /opt/raziel-verifier-runtime/verifierd-verifier
      RAZIEL_VERIFIER_CHILD_SOCKET_PATH: /run/raziel-verifier/child.sock
      RAZIEL_VERIFIER_LAUNCHER_SOCKET_PATH: /run/raziel-verifier/launcher.sock
    mem_limit: "2147483648"
    memswap_limit: "2147483648"
    network_mode: none
    read_only: true
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=0700,size=67108864,uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}
    volumes:
      - type: volume
        source: verifierd-worker-runtime
        target: /opt/raziel-verifier-runtime
        read_only: true
      - type: volume
        source: verifierd-worker-ipc
        target: /run/raziel-verifier
    depends_on:
      verifierd-worker-build:
        condition: service_completed_successfully
      verifierd-worker-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/raziel-verifier/launcher.sock &&
          test "$$(stat --format=%a /run/raziel-verifier/launcher.sock)" = 600 &&
          test "$$(stat --format=%u /run/raziel-verifier/launcher.sock)" = "${HOST_UID:-1000}"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: unless-stopped
    profiles: ["services"]

  verifierd-test-build-init:
    <<: *toolchain-service
    user: "0:0"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        install -d -m 0700 /var/cache/raziel-verifier-test
        chown -R \
          "$$RAZIEL_PRIVATE_UID:$$RAZIEL_PRIVATE_GID" \
          /var/cache/raziel-verifier-test
        test "$$(stat --format=%a /var/cache/raziel-verifier-test)" = 700
        test "$$(stat --format=%u /var/cache/raziel-verifier-test)" = "$$RAZIEL_PRIVATE_UID"
        test "$$(stat --format=%g /var/cache/raziel-verifier-test)" = "$$RAZIEL_PRIVATE_GID"
    environment:
      RAZIEL_PRIVATE_GID: "${HOST_GID:-1000}"
      RAZIEL_PRIVATE_UID: "${HOST_UID:-1000}"
      RUSTUP_TOOLCHAIN: "${RUST_VERSION}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - verifierd-test-build-cache:/var/cache/raziel-verifier-test
    profiles: ["verifier-acceptance"]

  verifierd:
    <<: *secure-rust-service
    command: ["cargo", "run", "--locked", "--offline", "-p", "verifierd", "--bin", "verifierd"]
    environment:
      CARGO_HOME: /usr/local/cargo
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_DIR: /tmp/raziel-target
      HOME: /tmp/raziel-home
      RAZIEL_EXPECTED_SP1_VKEY_HASH: ${RAZIEL_EXPECTED_SP1_VKEY_HASH:-}
      RAZIEL_EXPECTED_VERIFICATION_KEY_ID: ${RAZIEL_EXPECTED_VERIFICATION_KEY_ID:-}
      RAZIEL_REGISTRY_PATH: /var/lib/raziel/registry
      RAZIEL_TRUST_DOMAIN_ID: ${RAZIEL_TRUST_DOMAIN_ID:-raziel-local-dev}
      RAZIEL_VERIFIER_BIND_ADDRESS: 0.0.0.0:50053
      RAZIEL_VERIFIER_LAUNCHER_SOCKET_PATH: /run/raziel-verifier/launcher.sock
      RUSTUP_TOOLCHAIN: "1.97.1"
    volumes:
