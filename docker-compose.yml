name: raziel

x-toolchain-service: &toolchain-service
  image: raziel-toolchain:m0
  build:
    context: .
    dockerfile: tools/docker/toolchain.Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE}
      GO_IMAGE: ${GO_IMAGE}
      BUF_IMAGE: ${BUF_IMAGE}
      RUST_IMAGE: ${RUST_IMAGE}
      PNPM_VERSION: ${PNPM_VERSION}
      SP1_VERSION: ${SP1_VERSION}
      SP1_CARGO_PROVE_AMD64_SHA256: ${SP1_CARGO_PROVE_AMD64_SHA256}
      SP1_CARGO_PROVE_ARM64_SHA256: ${SP1_CARGO_PROVE_ARM64_SHA256}
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
    - pnpm-store:/pnpm/store
  init: true

services:
  toolchain:
    <<: *toolchain-service
    command: ["sleep", "infinity"]
    profiles: ["tools"]

  spicedb:
    image: ${SPICEDB_IMAGE}
    command:
      - serve-testing
      - --grpc-preshared-key=${SPICEDB_PRESHARED_KEY:-raziel-local-development-only}
      - --http-enabled=true
    ports:
      - "50051:50051"
      - "8443:8443"

  spicedb-equivalence:
    image: ${SPICEDB_IMAGE}
    command:
      - serve
      - --grpc-preshared-key=raziel-equivalence-only
      - --skip-release-check
      - --telemetry-endpoint=
    profiles: ["equivalence"]

  razield:
    <<: *toolchain-service
    command: ["cargo", "run", "-p", "razield"]
    profiles: ["services"]

  verifierd:
    <<: *toolchain-service
    command: ["cargo", "run", "-p", "verifierd"]
    profiles: ["services"]

  demo-gateway:
    <<: *toolchain-service
    command: ["pnpm", "--filter", "@raziel/demo-gateway", "dev", "--hostname", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"
    profiles: ["apps"]

  demo-console:
    <<: *toolchain-service
    command: ["pnpm", "--filter", "@raziel/demo-console", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    profiles: ["apps"]

volumes:
  cargo-git:
  cargo-registry:
  pnpm-store:
