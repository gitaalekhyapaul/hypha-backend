[package]
name = "verifierd"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ed25519-dalek.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
raziel-authority.workspace = true
raziel-authorization-core.workspace = true
raziel-canonical.workspace = true
raziel-proto = { workspace = true, features = ["services"] }
raziel-prover = { workspace = true, features = ["verification"] }
raziel-verifier = { path = "../../crates/verifier" }
sha2.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["router"] }
tonic-prost.workspace = true

[[bin]]
name = "verifierd-worker"
path = "src/bin/verifierd-worker.rs"

[[bin]]
name = "verifierd-verifier"
path = "src/bin/verifierd-verifier.rs"
