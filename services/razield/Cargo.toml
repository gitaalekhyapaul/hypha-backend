[package]
name = "razield"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
one-shot-prover = ["dep:raziel-prover"]

[dependencies]
bullmq.workspace = true
ed25519-dalek.workspace = true
prost.workspace = true
prost-types.workspace = true
raziel-authority.workspace = true
raziel-authorization-core.workspace = true
raziel-policy-ir.workspace = true
raziel-prover = { workspace = true, features = ["proving"], optional = true }
raziel-proto = { workspace = true, features = ["services"] }
raziel-snapshot.workspace = true
raziel-verifier = { path = "../../crates/verifier" }
raziel-witness = { path = "../../crates/witness" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["router"] }

[dev-dependencies]
raziel-canonical.workspace = true

[[bin]]
name = "razield-prover"
path = "src/bin/razield-prover.rs"
required-features = ["one-shot-prover"]
