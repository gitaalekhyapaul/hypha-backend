[package]
name = "razield"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["capability-service"]
capability-service = [
  "dep:bullmq",
  "dep:raziel-prover",
  "dep:raziel-witness",
  "dep:serde",
  "dep:serde_json",
]
one-shot-prover = ["capability-service", "raziel-prover/proving"]

[dependencies]
bullmq = { workspace = true, optional = true }
ed25519-dalek.workspace = true
getrandom.workspace = true
prost.workspace = true
prost-types.workspace = true
raziel-admin = { path = "../../tools/raziel-admin" }
raziel-authority.workspace = true
raziel-authorization-core.workspace = true
raziel-policy-ir.workspace = true
raziel-prover = { workspace = true, features = ["verification"], optional = true }
raziel-proto = { workspace = true, features = ["services"] }
raziel-snapshot.workspace = true
raziel-verifier = { path = "../../crates/verifier" }
raziel-witness = { path = "../../crates/witness", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
spicedb-rs-proto.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["router"] }

[dev-dependencies]
raziel-canonical.workspace = true

[[bin]]
name = "razield-prover"
path = "src/bin/razield-prover.rs"
required-features = ["one-shot-prover"]
