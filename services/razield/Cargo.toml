[package]
name = "razield"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["capability-service"]
access-service = ["dep:redis", "dep:serde", "dep:serde_json"]
access-dispatch = ["access-service", "dep:bullmq"]
capability-service = [
  "dep:bullmq",
  "dep:raziel-prover",
  "dep:raziel-witness",
  "dep:serde",
  "dep:serde_json",
]
one-shot-prover = ["capability-service", "raziel-prover/proving"]

[dependencies]
bullmq = { workspace = true, optional = true }
ed25519-dalek.workspace = true
getrandom.workspace = true
prost.workspace = true
prost-types.workspace = true
raziel-admin = { path = "../../tools/raziel-admin" }
raziel-authority.workspace = true
raziel-authorization-core.workspace = true
raziel-policy-ir.workspace = true
raziel-prover = { workspace = true, features = ["verification"], optional = true }
raziel-proto = { workspace = true, features = ["services"] }
raziel-snapshot.workspace = true
raziel-verifier = { path = "../../crates/verifier" }
raziel-witness = { path = "../../crates/witness", optional = true }
redis = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
spicedb-rs-proto.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["router"] }

[dev-dependencies]
raziel-canonical.workspace = true

[[bin]]
name = "razield-prover"
path = "src/bin/razield-prover.rs"
required-features = ["one-shot-prover"]

[[bin]]
name = "razield"
path = "src/main.rs"
required-features = ["capability-service"]

[[bin]]
name = "razield-capability"
path = "src/bin/razield-capability.rs"
required-features = ["capability-service"]

[[bin]]
name = "razield-proof-launcher"
path = "src/bin/razield-proof-launcher.rs"
required-features = ["capability-service"]

[[bin]]
name = "razield-proof-worker"
path = "src/bin/razield-proof-worker.rs"
required-features = ["capability-service"]

[[bin]]
name = "razield-access"
path = "src/bin/razield-access.rs"
required-features = ["access-service"]

[[bin]]
name = "razield-access-dispatch"
path = "src/bin/razield-access-dispatch.rs"
required-features = ["access-dispatch"]

[[test]]
name = "access_request"
path = "src/access_request/tests.rs"
required-features = ["access-service"]

[[test]]
name = "request_preparation"
path = "tests/request_preparation.rs"
required-features = ["access-service"]

[[test]]
name = "capability_publication"
path = "tests/capability_publication.rs"
required-features = ["capability-service"]

[[test]]
name = "capability_service"
path = "tests/capability_service.rs"
required-features = ["capability-service"]

[[test]]
name = "bullmq_conformance"
path = "tests/bullmq_conformance.rs"
required-features = ["capability-service"]
