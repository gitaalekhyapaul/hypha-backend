[package]
name = "raziel-prover"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["proving"]
proving = [
  "verification",
  "dep:raziel-authorization-core",
  "dep:raziel-canonical",
  "dep:sha2",
  "dep:sp1-core-executor",
  "dep:sp1-sdk",
  "sp1-sdk/blocking",
  "sp1-sdk/native-gnark",
]
verification = ["dep:sp1-verifier"]

[dependencies]
bincode.workspace = true
raziel-authorization-core = { workspace = true, optional = true }
raziel-canonical = { workspace = true, optional = true }
serde.workspace = true
sha2 = { workspace = true, optional = true }
sp1-core-executor = { workspace = true, optional = true }
sp1-sdk = { workspace = true, optional = true }
sp1-verifier = { workspace = true, optional = true }

[dev-dependencies]
raziel-policy-ir.workspace = true
raziel-snapshot.workspace = true
