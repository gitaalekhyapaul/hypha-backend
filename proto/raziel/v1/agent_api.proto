syntax = "proto3";

package raziel.v1;

import "raziel/v1/capability.proto";

// AgentIdentityResponse is public identity metadata, not an authorization grant.
message AgentIdentityResponse {
  uint32 format_version = 1;
  string agent_id = 2;
  bytes public_key = 3;
  bytes key_thumbprint = 4;
  string audience = 5;
  int64 token_expires_at_unix_seconds = 6;
}

// Request context stays in owner-private storage and is never echoed in a result.
message AccessIntent {
  uint32 format_version = 1;
  string request_id = 2;
  string task_id = 3;
  string purpose = 4;
  string action = 5;
  string dataset_id = 6;
  uint64 dataset_revision = 7;
  repeated AuthorizationContextEntry request_context = 8;
}

enum AccessRequestState {
  ACCESS_REQUEST_STATE_UNSPECIFIED = 0;
  ACCESS_REQUEST_STATE_PENDING_REVIEW = 1;
  ACCESS_REQUEST_STATE_APPROVED_WAITING = 2;
  ACCESS_REQUEST_STATE_PREPARING = 3;
  ACCESS_REQUEST_STATE_AWAITING_SIGNATURE = 4;
  ACCESS_REQUEST_STATE_WAITING_FOR_AGENT = 5;
  ACCESS_REQUEST_STATE_SUBMITTING = 6;
  ACCESS_REQUEST_STATE_QUEUED = 7;
  ACCESS_REQUEST_STATE_EXECUTING = 8;
  ACCESS_REQUEST_STATE_PROVING = 9;
  ACCESS_REQUEST_STATE_CANCELLING = 10;
  ACCESS_REQUEST_STATE_READY = 11;
  ACCESS_REQUEST_STATE_REJECTED = 12;
  ACCESS_REQUEST_STATE_CANCELED = 13;
  ACCESS_REQUEST_STATE_EXPIRED = 14;
  ACCESS_REQUEST_STATE_FAILED = 15;
}

message AccessPolicyBinding {
  string policy_record_id = 1;
  bytes policy_hash = 2;
  string resource_type = 3;
  string resource_scope = 4;
}

message IssuanceProposal {
  uint32 format_version = 1;
  string proposal_id = 2;
  uint64 generation = 3;
  int64 signature_deadline_unix_seconds = 4;
  bytes agent_public_key = 5;
  string task_id = 6;
  string purpose = 7;
  string action = 8;
  AccessPolicyBinding policy_binding = 9;
  string snapshot_id = 10;
  bytes snapshot_root = 11;
  int64 requested_expires_at_unix_seconds = 12;
}

// Only public metadata. Lists omit capability bytes and never include private intent.
message AccessRequest {
  uint32 format_version = 1;
  string request_id = 2;
  string agent_id = 3;
  string task_id = 4;
  string purpose = 5;
  string action = 6;
  string dataset_id = 7;
  uint64 dataset_revision = 8;
  AccessRequestState state = 9;
  uint64 generation = 10;
  int64 created_at_unix_seconds = 11;
  int64 updated_at_unix_seconds = 12;
  int64 deadline_unix_seconds = 13;
  AccessPolicyBinding policy_binding = 14;
  IssuanceProposal proposal = 15;
  optional string proof_job_id = 16;
  ProofJobState proof_job_state = 17;
  ProofMetrics metrics = 18;
  bytes capability = 19;
  optional string error_code = 20;
}

message CreateAccessRequestResponse {
  uint32 format_version = 1;
  AccessRequest request = 2;
  bool created = 3;
}

message ListAccessRequestsResponse {
  uint32 format_version = 1;
  repeated AccessRequest requests = 2;
  optional string next_cursor = 3;
}

message AccessRequestMutation {
  uint32 format_version = 1;
  uint64 expected_generation = 2;
}
