version: v2

clean: true

inputs:
  - directory: proto

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gitaalekhyapaul/hypha-backend/tools/spicedb-ir-compiler/gen

plugins:
  - remote: buf.build/bufbuild/es:v2.12.1
    revision: 1
    out: packages/proto-ts/src/gen
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    revision: 1
    out: gen/rust
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    revision: 1
    out: gen/rust-services
    opt:
      - no_include
  - remote: buf.build/protocolbuffers/go:v1.36.11
    revision: 1
    out: tools/spicedb-ir-compiler/gen
    opt:
      - paths=source_relative
