[workspace]
members = [
  "crates/authorization-core",
  "crates/authority",
  "crates/canonical",
  "crates/policy-ir",
  "crates/proto",
  "crates/prover",
  "crates/snapshot",
  "crates/verifier",
  "crates/witness",
  "programs/authorization-guest",
  "services/razield",
  "services/verifierd",
  "tools/raziel-admin",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/gitaalekhyapaul/hypha-backend"

[workspace.dependencies]
bincode = "=1.3.3"
bullmq = { package = "bullmq-official", version = "=1.2.3" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "pkcs8", "signature", "zeroize"] }
prost = "=0.14.4"
prost-reflect = { version = "=0.16.5", default-features = false }
prost-types = "=0.14.4"
raziel-authority = { path = "crates/authority" }
raziel-authorization-core = { path = "crates/authorization-core" }
raziel-canonical = { path = "crates/canonical" }
raziel-policy-ir = { path = "crates/policy-ir", default-features = false }
raziel-proto = { path = "crates/proto" }
raziel-snapshot = { path = "crates/snapshot" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
sp1-sdk = { version = "=6.3.1", default-features = false, features = ["blocking", "native-gnark"] }
sp1-core-executor = { version = "=6.3.1", default-features = false }
sp1-zkvm = { version = "=6.3.1", default-features = false, features = ["lib"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
